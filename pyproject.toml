[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projectosint"
version = "0.1.0"
description = "Bounded, provenance-rich OSINT collection platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ProjectOSINT" }]
keywords = ["osint", "reconnaissance", "threat-intelligence"]
dependencies = [
  "httpx>=0.27,<0.29",
  "certifi>=2024.2.2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "loguru>=0.7,<0.8",
  "PyYAML>=6.0,<7",
  "dnspython>=2.6,<3",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "jinja2>=3.1,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]
desktop = ["PySide6-Essentials>=6.7,<7"]

[project.scripts]
projectosint = "projectosint.cli:main"
projectosint-desktop = "projectosint.desktop:main"

[tool.setuptools.packages.find]
include = ["projectosint*"]

[tool.setuptools.package-data]
"projectosint.web" = ["static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["projectosint/web/static", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["projectosint"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "bs4.*", "dns.*", "aiosqlite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
